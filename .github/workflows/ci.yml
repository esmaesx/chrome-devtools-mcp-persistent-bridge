name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
      - name: Generate SBOM
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx --omit=dev | Set-Content -LiteralPath sbom.cdx.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
